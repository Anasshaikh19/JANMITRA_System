services:
  # ==============================================================================
  # PostgreSQL with PostGIS Spatial Extension (Production)
  # ==============================================================================
  postgres:
    image: postgis/postgis:15-3.3
    container_name: janmitra_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-janmitra_db}
      POSTGRES_USER: ${POSTGRES_USER:-janmitra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-janmitra_user} -d ${POSTGRES_DB:-janmitra_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - janmitra_network

  # ==============================================================================
  # Redis - Cache & Celery Message Broker (Production)
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: janmitra_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - janmitra_network

  # ==============================================================================
  # Backend - Django REST Framework API with Gunicorn & WhiteNoise (Production)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: janmitra_prod_backend
    restart: always
    command: gunicorn resolveIT.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: resolveIT.settings.production
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-janmitra.nagpur.gov.in,localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-janmitra_db}
      POSTGRES_USER: ${POSTGRES_USER:-janmitra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_SSL_REQUIRE: ${POSTGRES_SSL_REQUIRE:-false}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://janmitra.nagpur.gov.in}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - janmitra_network

  # ==============================================================================
  # Celery Worker - Asynchronous Task Processing (Production)
  # ==============================================================================
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: janmitra_prod_celery
    restart: always
    command: celery -A resolveIT worker -l info --concurrency=4
    volumes:
      - media_volume:/app/media
    environment:
      DJANGO_SETTINGS_MODULE: resolveIT.settings.production
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-}
      POSTGRES_DB: ${POSTGRES_DB:-janmitra_db}
      POSTGRES_USER: ${POSTGRES_USER:-janmitra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_SSL_REQUIRE: ${POSTGRES_SSL_REQUIRE:-false}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - janmitra_network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# ==============================================================================
# Shared Bridge Network
# ==============================================================================
networks:
  janmitra_network:
    driver: bridge
